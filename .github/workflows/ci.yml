name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit # règles de docs/ : contrastes, lisibilité, navigation, vocabulaire…
      - run: npm run build # inclut astro check (types + contenus)
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
